<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script>
      if (window.location.pathname === '/') {
        const languagePaths = {
          de: '/de',
          en: '/en',
          fr: '/fr',
          sv: '/sv'
        }

        let savedPath = null

        try {
          savedPath = localStorage.getItem('brew-even-language')
        } catch {
          savedPath = null
        }

        const browserPath = (navigator.languages.length ? navigator.languages : [navigator.language])
          .map((language) => languagePaths[language.split('-')[0].toLowerCase()])
          .find((path) => path !== undefined)

        const preferredPath = savedPath && Object.values(languagePaths).includes(savedPath)
          ? savedPath
          : browserPath ?? '/en'

        window.location.replace(`${preferredPath}${window.location.search}${window.location.hash}`)
      }
    </script>

    <style>
      html {
        background: #fff9e9;
      }

      html[data-theme='dark'] {
        background: #140d0c;
      }
    </style>

    <script>
      const savedTheme = localStorage.getItem('theme')
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches

      const theme =
        savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : prefersDark ? 'dark' : 'light'

      document.documentElement.dataset.theme = theme
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Brew-even</title>
    
    <meta name="brew-even-seo" content="placeholder" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
